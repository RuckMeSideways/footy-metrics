# Place this file at: .github/workflows/update-standings.yml
# No secret required.
name: Update standings

on:
  schedule:
    - cron: '30 6 * * *'   # daily, 06:30 UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch standings
        run: python scripts/update_standings.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings/
          if git diff --cached --quiet; then
            echo "No standings changes"
          else
            git commit -m "Update standings $(date -u +'%Y-%m-%d')"
            git push
          fi
